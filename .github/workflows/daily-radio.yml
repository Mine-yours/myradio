name: Daily dialogue radio
on:
  schedule:
    - cron: '0 22 * * *' # 07:00 JST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-radio
  cancel-in-progress: false
jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install audio tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Generate episode
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 tools/daily_dialogue.py
      - name: Commit script and publish
        run: |
          if [ -z "$(git status --porcelain episodes episodes.json)" ]; then
            echo "No new episode"; exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add episodes episodes.json
          git commit -m "radio: daily dialogue episode"
          git push origin HEAD:main
          bash tools/publish.sh
